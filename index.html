    <script>
      (function () {
        try {
          var BUILD_VER = '20261120d';
          if (localStorage.getItem('rg_crm_client_build') !== BUILD_VER) {
            try { sessionStorage.removeItem('rg_crm_swr_v1'); } catch (_s) {}
            ['rg_crm_gas_url', 'rg_crm_backend_url', 'rg_crm_backend_api_url'].forEach(function (k) {
              try { localStorage.removeItem(k); } catch (_l) {}
            });
            try {
              if (typeof indexedDB !== 'undefined' && typeof indexedDB.deleteDatabase === 'function') {
                indexedDB.deleteDatabase('rg_crm_idb_v1');
              }
            } catch (_i) {}
            try {
              if (window.caches && typeof window.caches.keys === 'function') {
                window.caches.keys().then(function (names) {
                  names.forEach(function (n) { window.caches.delete(n).catch(function () {}); });
                }).catch(function () {});
              }
            } catch (_c) {}
            try { localStorage.setItem('rg_crm_client_build', BUILD_VER); } catch (_b) {}
          }
          var raw = localStorage.getItem('rg_crm_user_prefs');
          var prefs = raw ? JSON.parse(raw) : null;
          var theme = prefs && (prefs.theme === 'dark' || prefs.theme === 'light') ? prefs.theme : '';
          if (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
          theme = theme === 'dark' ? 'dark' : 'light';
          var lang = prefs && prefs.lang === 'en' ? 'en' : 'ar';
          var navPos = prefs && (prefs.sidebarPosition === 'top' || prefs.sidebarPosition === 'bottom') ? prefs.sidebarPosition : 'side';
          var timeFmt = prefs && prefs.timeFormat === '12h' ? '12h' : '24h';
          var html = document.documentElement;
          html.setAttribute('data-theme', theme);
          html.setAttribute('lang', lang);
          html.setAttribute('dir', lang === 'en' ? 'ltr' : 'rtl');
          html.setAttribute('data-nav-pos', navPos);
          html.setAttribute('data-time-format', timeFmt);
          if (theme === 'dark') html.classList.add('dark');
          else html.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
